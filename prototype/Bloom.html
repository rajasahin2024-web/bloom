<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom IELTS Academy — Student Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="bloom-core.css" rel="stylesheet">
</head>
<body>

<div class="app" id="app">
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="side" id="side">
    <div class="brand">
      <img class="mark" src="assets/bloom-mark.png" alt="Bloom IELTS Academy">
      <div class="wm"><b>Bloom</b><span>IELTS Academy</span></div>
    </div>
    <a class="nav-home" id="homeOut" href="index.html" title="Back to the Bloom website">
      <i class="fa-solid fa-house"></i><span>Home</span><i class="fa-solid fa-arrow-up-right-from-square ex"></i>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" onclick="navTo(B.role==='student'?'settings':'profile')" id="whoBox"></div>
      <a href="index.html" style="display:flex;align-items:center;gap:8px;padding:9px 11px;margin-top:6px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink-4)"><i class="fa-solid fa-globe" style="width:16px;text-align:center"></i><span>Bloom website</span></a>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">
    <header class="top">
      <button class="icobtn" style="display:none" id="burger" onclick="document.getElementById('side').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
      <div>
        <div class="crumb" id="crumb">Student Platform</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="sp"></div>
      <div class="roles" id="roleSwitch"></div>
      <div id="topStreak"></div>
      <button class="icobtn" title="Bloom Tutor" onclick="navTo('tutor')" style="color:var(--violet);border-color:var(--violet-soft);background:var(--violet-soft)"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
      <button class="icobtn" title="Switch theme" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="themeIc"></i></button>
      <button class="icobtn" title="Notifications" onclick="openNotifs()"><i class="fa-regular fa-bell"></i><span class="dot" id="notifDot" style="display:none"></span></button>
      <button class="icobtn" title="Sign out" onclick="signOut()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="mask" id="mask"></div>
<div class="toast-wrap" id="toasts"></div>

<script src="bloom-data-core.js"></script>
<script src="bloom-data-lang.js"></script>
<script src="bloom-data-content.js"></script>
<script src="bloom-data-library.js"></script>
<script src="bloom-data-tutoring.js"></script>
<script src="bloom-data-staff.js"></script>
<script src="bloom-data-exams.js"></script>
<script src="bloom-data-hr.js"></script>
<script src="bloom-cms-data.js"></script>
<script src="bloom-data-ops.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   BLOOM — application shell: state, storage, router, chrome
═══════════════════════════════════════════════════════════════ */

const DEFAULT_STATE = {
  onboarded:false, section:'dashboard', role:'student', teacherId:'em', signedIn:false,
  profile:{ ...DEMO_STUDENT },
  placement:null,                       /* { cefr, band, skills:{}, done, date } */
  scores:{ listening:null, reading:null, writing:null, speaking:null },
  history:[],                           /* score events over time */
  xp:0, streak:0, lastDay:null, badges:[], goalMins:45, todayMins:0,
  vocab:{},                             /* wordId → srs */
  grammar:{},                           /* lessonId → { done, score } */
  essays:[], speeches:[], mockRuns:[], readRuns:[], listenRuns:[],
  library:{ downloaded:[], watched:{}, heard:{}, saved:[] },
  uploads:[], lessons:[], tasks:null, tutoring:[],
  plan:null, planDone:{}, tutorChat:[], notifs:[],
};

let B = null;

/* ── handoff from login.html ── */
function consumeAuth(){
  let a = null;
  try { const raw = localStorage.getItem('bloom_auth'); if (raw){ a = JSON.parse(raw); localStorage.removeItem('bloom_auth'); } } catch(e){}
  if (!a) return;
  B.role = a.role || 'student';
  if (a.teacherId) B.teacherId = a.teacherId;
  B.signedIn = true;
  if (a.action === 'signup'){
    const fresh = structuredClone(DEFAULT_STATE);
    fresh.role = 'student'; fresh.signedIn = true;
    fresh.profile = { ...DEMO_STUDENT, name:a.name, email:a.email,
      country:a.country || DEMO_STUDENT.country, l1:a.l1 || DEMO_STUDENT.l1,
      exam:a.exam || 'ielts-a', plan:a.plan || 'PLUS', joined:today(), avatar:null };
    fresh.onboarded = false; fresh.section = 'onboarding';
    B = fresh; obStep = 1; save();
    return;
  }
  if (a.role === 'student'){
    B.profile.name = a.name || B.profile.name;
    B.profile.email = a.email || B.profile.email;
  }
  B.section = (a.role === 'student') ? (B.onboarded ? 'dashboard' : 'onboarding') : ROLES[a.role].home;
  save();
}

function signOut(){
  if (!confirm('Sign out of Bloom? Your progress stays saved on this device.')) return;
  B.signedIn = false; save();
  location.href = 'login.html';
}

function loadState(){
  try {
    const raw = localStorage.getItem('bloom_state');
    B = raw ? { ...structuredClone(DEFAULT_STATE), ...JSON.parse(raw) } : structuredClone(DEFAULT_STATE);
  } catch(e){ B = structuredClone(DEFAULT_STATE); }
  B.profile = { ...DEMO_STUDENT, ...(B.profile||{}) };
  B.scores = { ...DEFAULT_STATE.scores, ...(B.scores||{}) };
  rollDay();
}
function save(){ try { localStorage.setItem('bloom_state', JSON.stringify(B)); } catch(e){} }
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayOffset(n){ const d = new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rollDay(){
  if (B.lastDay === today()) return;
  if (B.lastDay && B.lastDay !== dayOffset(-1)) B.streak = 0;
  B.todayMins = 0; save();
}
function markActive(mins){
  const t = today();
  if (B.lastDay !== t){ B.streak = (B.lastDay === dayOffset(-1)) ? B.streak + 1 : 1; B.lastDay = t; B.todayMins = 0; }
  B.todayMins += (mins || 0);
  save();
}
function addXP(n, why){
  B.xp += n; save();
  if (why) toast('+' + n + ' XP · ' + why, 'fa-bolt');
}
function earn(badgeId){
  if (B.badges.includes(badgeId)) return;
  const b = BADGES.find(x => x.id === badgeId); if (!b) return;
  B.badges.push(badgeId); B.xp += b.xp; save();
  notify('Badge unlocked — ' + b.name, b.desc, 'fa-award');
  toast('Badge unlocked · ' + b.name, 'fa-award');
}
function notify(title, body, ic){
  B.notifs.unshift({ id:'n'+Date.now(), title, body, ic:ic||'fa-bell', at:new Date().toISOString(), read:false });
  B.notifs = B.notifs.slice(0,40); save();
  const d = document.getElementById('notifDot'); if (d) d.style.display = 'block';
}

/* ── chrome helpers ── */
function toast(msg, ic){
  const w = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<i class="fa-solid ${ic||'fa-circle-check'}"></i> ${msg}`;
  w.appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s,transform .3s'; el.style.opacity=0; el.style.transform='translateY(10px)'; setTimeout(() => el.remove(), 320); }, 2600);
}
function modal(html, w){
  const m = document.getElementById('mask');
  m.innerHTML = `<div class="modal" style="width:min(${w||620}px,100%)">${html}</div>`;
  m.classList.add('on');
  m.onclick = e => { if (e.target === m) closeModal(); };
}
function closeModal(){ document.getElementById('mask').classList.remove('on'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ return String(n||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || 'ME'; }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function toggleTheme(){
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeIc').className = d ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
  try { localStorage.setItem('bloom_theme', d ? 'light' : 'dark'); } catch(e){}
}

function phead({ eyebrow, title, sub, actions }){
  return `<div class="phead">
    <div>
      ${eyebrow ? `<div class="eb">${eyebrow}</div>` : ''}
      <h2>${title}</h2>
      ${sub ? `<p>${sub}</p>` : ''}
    </div>
    ${actions ? `<div class="acts">${actions}</div>` : ''}
  </div>`;
}
/* Brand marks (WhatsApp, Instagram, YouTube…) ship only in the Brands family,
   so a hardcoded fa-solid prefix renders a notdef box. Same handling renderNav
   applies to the nav items. */
const FA_BRANDS = /^fa-(whatsapp|instagram|youtube|linkedin|linkedin-in|facebook|facebook-f|x-twitter|twitter|tiktok|telegram|google|apple|windows|android|github)$/;
function faFam(ic){ return FA_BRANDS.test(String(ic||'').trim()) ? 'fa-brands' : 'fa-solid'; }
function statCard(l, v, s, tone, spark){
  return `<div class="stat"><div class="l">${l}</div><div class="v ${tone||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}${spark?`<i class="${faFam(spark)} ${spark} spark"></i>`:''}</div>`;
}
function ringHTML(p, big, small, size, color){
  const s = size || 108;
  return `<div class="ring" style="width:${s}px;height:${s}px;background:conic-gradient(${color||'var(--leaf-500)'} ${p}%, var(--paper-2) 0)">
    <div><b style="font-size:${Math.round(s*0.25)}px">${big}</b><span>${small}</span></div></div>`;
}

/* ═══ NAVIGATION ═══ */
const NAV = [
  { grp:'Learn' },
  { id:'dashboard', name:'Dashboard',   ic:'fa-house' },
  { id:'live',      name:'Live Classes', ic:'fa-video' },
  { id:'schedule',  name:'My Schedule', ic:'fa-calendar-check' },
  { id:'library',   name:'School',      ic:'fa-graduation-cap' },
  { id:'plan',      name:'My Study Plan',ic:'fa-calendar-days' },
  { id:'tutor',     name:'Bloom Tutor', ic:'fa-wand-magic-sparkles' },
  { id:'tutoring',  name:'1-on-1 Tutoring', ic:'fa-chalkboard-user' },
  { grp:'Skills' },
  { id:'reading',   name:'Reading',     ic:'fa-book-open' },
  { id:'listening', name:'Listening',   ic:'fa-headphones' },
  { id:'writing',   name:'Writing Lab', ic:'fa-pen-nib' },
  { id:'speaking',  name:'Speaking Lab',ic:'fa-microphone' },
  { grp:'Language' },
  { id:'vocab',     name:'Vocabulary',  ic:'fa-spell-check' },
  { id:'grammar',   name:'Grammar',     ic:'fa-diagram-project' },
  { grp:'Exam' },
  { id:'mocks',     name:'Mock Tests',  ic:'fa-clipboard-list' },
  { id:'progress',  name:'My Progress', ic:'fa-chart-line' },
  { id:'profile',   name:'English Profile', ic:'fa-id-card' },
  { id:'settings',  name:'Settings',    ic:'fa-gear' },

  { grp:'Teaching', role:'teacher' },
  { id:'faculty',     name:'My Teaching',  ic:'fa-chalkboard', role:'teacher' },
  { id:'facultylive', name:'Live Teaching', ic:'fa-video', role:'teacher' },
  { id:'facultyplan', name:'Faculty Planner', ic:'fa-calendar-week', role:'teacher' },
  { id:'roster',      name:'My Students',  ic:'fa-users', role:'teacher' },
  { id:'content',     name:'Content Manager', ic:'fa-cloud-arrow-up', role:'teacher' },
  { id:'exambuilder', name:'Exam Builder',  ic:'fa-clipboard-check', role:'teacher' },

  { grp:'Administration', role:'admin' },
  { id:'admin',      name:'Overview',     ic:'fa-gauge-high', role:'admin' },
  { id:'admissions', name:'Admissions',   ic:'fa-user-plus', role:'admin' },
  { id:'comms',      name:'Communications',ic:'fa-envelope', role:'admin' },
  { id:'academic',   name:'Academic',     ic:'fa-book-open', role:'admin' },
  { id:'finance',    name:'Finance',      ic:'fa-sterling-sign', role:'admin' },
  { id:'people',     name:'Personnel',    ic:'fa-users', role:'admin' },
  { id:'content',    name:'Content Manager',  ic:'fa-cloud-arrow-up', role:'admin' },
  { id:'exambuilder',name:'Exam Builder',  ic:'fa-clipboard-check', role:'admin' },
  { id:'adminplan',  name:'Admin Planner',ic:'fa-calendar-days', role:'admin' },
  { id:'operations', name:'Operations',   ic:'fa-sliders', role:'admin' },
  { id:'analytics',  name:'Analytics',    ic:'fa-chart-pie', role:'admin' },
  { id:'tracks',     name:'Exam Tracks',  ic:'fa-layer-group', role:'admin' },
  { id:'hr',         name:'Human Resources', ic:'fa-id-badge', role:'admin' },
  { id:'system',     name:'System',       ic:'fa-gear', role:'admin' },

  { grp:'Public website', role:'admin' },
  { id:'site',       name:'Website Content', ic:'fa-globe', role:'admin' },
  { id:'enquiries',  name:'Enquiries',    ic:'fa-inbox', role:'admin' },
  { id:'waset',      name:'WhatsApp Alerts', ic:'fa-whatsapp', role:'admin', brand:1 },
];

const STAFF_SECTIONS = ['faculty','facultylive','facultyplan','roster','content','admin','adminplan','people','operations','analytics','site','enquiries','waset','exambuilder','tracks','hr','admissions','comms','academic','finance','system'];

function roleNav(){
  const r = B.role || 'student';
  if (r === 'student') return NAV.filter(n => !n.role);
  return [...NAV.filter(n => n.role === r), { grp:'School' }, ...NAV.filter(n => ['library','tutoring'].includes(n.id))];
}

function switchRole(r){
  B.role = r; save();
  navTo(ROLES[r].home);
  toast('Now viewing Bloom as ' + ROLES[r].name.toLowerCase(), ROLES[r].ic);
}

function renderNav(){
  const due = typeof vocabDue === 'function' ? vocabDue().length : 0;
  const r = B.role || 'student';
  document.getElementById('nav').innerHTML = roleNav().map(n => {
    if (n.grp) return `<div class="nav-grp">${n.grp}</div>`;
    const pip = n.id === 'vocab' && due ? `<span class="pip">${due}</span>` : '';
    return `<div class="nav-i ${B.section===n.id?'on':''}" ${n.brand?'data-brand="wa"':''} onclick="navTo('${n.id}')"><i class="${n.brand?'fa-brands':'fa-solid'} ${n.ic}"></i><span>${n.name}</span>${pip}</div>`;
  }).join('');
  const p = B.profile;
  const who = r === 'teacher' && typeof me === 'function' ? me().name : r === 'admin' ? 'Administration' : p.name;
  const sub = r === 'teacher' && typeof me === 'function' ? me().role : r === 'admin' ? 'Bloom IELTS Academy' : (B.placement?B.placement.cefr:'Not assessed') + ' · ' + examOf(p.exam).short;
  document.getElementById('whoBox').innerHTML = `
    ${r === 'student' && typeof avatarHTML === 'function' ? avatarHTML(28) : `<div class="av" style="${r!=='student'?'background:linear-gradient(140deg,var(--leaf-900),var(--leaf-600))':''}">${initials(who)}</div>`}
    <div style="min-width:0"><div class="nm">${esc(who.split(' ').slice(0,2).join(' '))}</div><div class="lv">${esc(sub)}</div></div>`;
  document.getElementById('topStreak').innerHTML = r === 'student' && B.streak
    ? `<div style="display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:30px;background:var(--amber-soft);color:#a86e14;font-size:12px;font-weight:800"><i class="fa-solid fa-fire"></i> ${B.streak} day${B.streak===1?'':'s'}</div>` : '';
  document.getElementById('notifDot').style.display = B.notifs.some(n=>!n.read) ? 'block' : 'none';
  const rs = document.getElementById('roleSwitch');
  if (rs) rs.innerHTML = Object.entries(ROLES).map(([k,v]) =>
    `<button class="${r===k?'on':''}" title="View as ${v.name}" onclick="switchRole('${k}')"><i class="fa-solid ${v.ic}"></i><span class="rl">${v.name}</span></button>`).join('');
}

const TITLES = { dashboard:'Dashboard', live:'Live Classes', schedule:'My Schedule', facultylive:'Live Teaching', library:'School', plan:'My Study Plan', tutor:'Bloom Tutor', tutoring:'1-on-1 Tutoring',
  content:'Content Manager', exambuilder:'Exam Builder', faculty:'My Teaching', facultyplan:'Faculty Planner', roster:'My Students',
  admin:'School Overview', adminplan:'Administrative Planner', people:'Personnel', operations:'Operations', analytics:'Analytics',
  admissions:'Admissions', comms:'Communications', academic:'Academic', finance:'Finance', system:'System Settings',
  site:'Website Content', enquiries:'Enquiry Inbox', waset:'WhatsApp Alerts', tracks:'Exam Tracks', hr:'Human Resources',
  settings:'Settings', reading:'Reading Academy', listening:'Listening Academy', writing:'Writing Lab', speaking:'Speaking Lab', vocab:'Vocabulary', grammar:'Grammar Academy', mocks:'Mock Tests', progress:'My Progress', profile:'Bloom English Profile', placement:'Placement Test' };

/* A render must never navigate. If a section's HTML calls navTo while it is
   still being built, the recursion would freeze the whole app — so swallow the
   re-entrant call and surface it instead of locking the main thread. */
let __navDepth = 0;
function navTo(sec){
  if (__navDepth > 0){ console.warn('navTo("' + sec + '") called during a render — ignored'); return; }
  if (!B.onboarded && sec !== 'onboarding'){ sec = 'onboarding'; }
  const r = B.role || 'student';
  if (r === 'student' && STAFF_SECTIONS.includes(sec)) sec = 'dashboard';
  if (r !== 'student' && !STAFF_SECTIONS.includes(sec) && !['library','tutoring','profile','settings'].includes(sec)) sec = ROLES[r].home;
  B.section = sec; save();
  document.getElementById('pageTitle').textContent = TITLES[sec] || 'Bloom';
  document.getElementById('crumb').textContent = sec === 'onboarding' ? 'Welcome' : r === 'admin' ? 'Administration' : r === 'teacher' ? 'Faculty' : 'Student Platform';
  const v = document.getElementById('view');
  __navDepth++;
  try { v.innerHTML = render(sec); } finally { __navDepth--; }
  v.scrollTop = 0; window.scrollTo(0,0);
  renderNav();
  document.getElementById('side').classList.remove('open');
  if (typeof afterRender === 'function') afterRender(sec);
}

function render(sec){
  try {
    switch(sec){
      case 'onboarding': return sec_onboarding();
      case 'placement':  return sec_placement();
      case 'dashboard':  return sec_dashboard();
      case 'library':    return sec_library();
      case 'live':       return sec_live();
      case 'schedule':   return sec_schedule();
      case 'facultylive':return sec_facultylive();
      case 'plan':       return sec_plan();
      case 'tutor':      return sec_tutor();
      case 'tutoring':   return sec_tutoring();
      case 'content':    return sec_content();
      case 'exambuilder':return sec_exambuilder();
      case 'faculty':    return sec_faculty();
      case 'facultyplan':return sec_facultyplan();
      case 'roster':     return sec_roster();
      case 'admin':      return sec_admin();
      case 'adminplan':  return sec_adminplan();
      case 'people':     return sec_people();
      case 'operations': return sec_operations();
      case 'analytics':  return sec_analytics();
      case 'tracks':     return sec_tracks();
      case 'hr':         return sec_hr();
      case 'site':       return sec_site();
      case 'enquiries':  return sec_enquiries();
      case 'waset':      return sec_waset();
      case 'admissions': return sec_admissions();
      case 'comms':      return sec_comms();
      case 'academic':   return sec_academic();
      case 'finance':    return sec_finance();
      case 'system':     return sec_system();
      case 'reading':    return sec_reading();
      case 'listening':  return sec_listening();
      case 'writing':    return sec_writing();
      case 'speaking':   return sec_speaking();
      case 'vocab':      return sec_vocab();
      case 'grammar':    return sec_grammar();
      case 'mocks':      return sec_mocks();
      case 'progress':   return sec_progress();
      case 'profile':    return sec_profile();
      case 'settings':   return sec_settings();
      default: return `<div class="empty"><i class="fa-solid fa-seedling"></i><b>Coming soon</b><span>This part of Bloom is still growing.</span></div>`;
    }
  } catch(e){
    console.error(e);
    return `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><b>Something went wrong loading this section</b><span>${esc(e.message)}</span></div>`;
  }
}
function afterRender(sec){
  if (B.role === 'admin' && typeof enqDrain === 'function') enqDrain();
  if (B.role === 'admin' && typeof hrAppDrain === 'function') hrAppDrain();
  if (sec === 'tutor' && typeof tutorScroll === 'function') tutorScroll();
}

function openNotifs(){
  B.notifs.forEach(n => n.read = true); save(); renderNav();
  modal(`
    <div class="modal-hd"><div style="flex:1"><h3>Notifications</h3><p>Everything Bloom has flagged for you</p></div>
      <button class="icobtn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-bd" style="padding:0">
      ${B.notifs.length ? B.notifs.map(n => `<div class="row"><div class="ic"><i class="fa-solid ${n.ic}"></i></div><div class="tx"><b>${esc(n.title)}</b><span>${esc(n.body)}</span></div><span style="font-size:10.5px;color:var(--ink-4);font-family:var(--mono)">${new Date(n.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div>`).join('')
        : `<div class="empty" style="border:none;background:transparent"><i class="fa-regular fa-bell"></i><b>Nothing yet</b><span>Milestones and reminders will appear here.</span></div>`}
    </div>`, 560);
}

/* ═══ ONBOARDING ═══ */
let obStep = 1;
const OB_STEPS = [['1','You'],['2','Your exam'],['3','Your goal'],['4','Your time']];

function sec_onboarding(){
  return `
    <div style="max-width:940px;margin:0 auto;padding-top:8px">
      <div style="text-align:center;margin-bottom:26px">
        <img src="assets/bloom-mark.png" alt="Bloom IELTS Academy" style="width:56px;height:56px">
        <h2 style="font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-1px">Welcome to <span style="color:var(--leaf-600)">Bloom</span></h2>
        <p style="font-size:14px;color:var(--ink-3);margin-top:8px;max-width:520px;margin-inline:auto;text-wrap:pretty">Four quick questions, then a placement test that gives you a real CEFR level and an honest band estimate. Nothing is guessed — everything after this is built from your answers.</p>
      </div>
      <div class="rail">${OB_STEPS.map((s,i) => {
        const n = i+1;
        return `<div class="s ${obStep===n?'on':obStep>n?'dn':''}"><div class="n">${obStep>n?'<i class="fa-solid fa-check" style="font-size:11px"></i>':s[0]}</div><div class="lb">${s[1]}</div></div>${i<3?`<div class="bar2 ${obStep>n?'f':''}"></div>`:''}`;
      }).join('')}</div>
      <div class="stage" id="obStage">${obStageHTML()}</div>
    </div>`;
}

function obStageHTML(){
  const p = B.profile;
  if (obStep === 1) return `
    <div class="stage-hd"><div class="eb">Step 1 of 4</div><h3>Tell us who you <em>are</em></h3><p>Your first language shapes the mistakes Bloom watches for — we use it to target your practice.</p></div>
    <div class="fgrid" style="max-width:560px;margin:0 auto">
      <div class="fg full"><label>Full name</label><input id="obName" value="${esc(p.name)}" placeholder="Your name"></div>
      <div class="fg full"><label>Email</label><input id="obEmail" type="email" value="${esc(p.email)}" placeholder="you@email.com"></div>
      <div class="fg"><label>Country</label><select id="obCountry">${COUNTRIES.map(c=>`<option ${p.country===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fg"><label>First language</label><select id="obL1">${L1.map(c=>`<option ${p.l1===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="stage-ft"><span style="font-size:12px;color:var(--ink-4)">Stored on this device only</span><button class="btn btn-p" onclick="obNext()">Choose my exam <i class="fa-solid fa-arrow-right"></i></button></div>`;

  if (obStep === 2) return `
    <div class="stage-hd"><div class="eb">Step 2 of 4</div><h3>Which exam are you <em>preparing</em> for?</h3><p>Bloom is built around IELTS, but every skill lab converts to your chosen scale.</p></div>
    <div class="tiles">${EXAMS.map(e => `
      <div class="tile ${p.exam===e.id?'on':''}" onclick="B.profile.exam='${e.id}';obPaint()">
        <span class="tk"><i class="fa-solid fa-circle-check"></i></span>
        <div class="ic"><i class="fa-solid ${e.ic}"></i></div>
        <div class="nm">${e.name}</div><div class="mt">${e.sections.length} sections</div>
      </div>`).join('')}</div>
    <div style="margin-top:16px;padding:13px 16px;border-radius:12px;background:var(--leaf-50);border-left:3px solid var(--leaf-500);font-size:12.5px;color:var(--ink-2)">${examOf(p.exam).blurb}</div>
    <div class="stage-ft"><button class="btn btn-g" onclick="obBack()"><i class="fa-solid fa-arrow-left"></i> Back</button><button class="btn btn-p" onclick="obNext()">Set my target <i class="fa-solid fa-arrow-right"></i></button></div>`;

  if (obStep === 3){
    const ex = examOf(p.exam);
    return `
    <div class="stage-hd"><div class="eb">Step 3 of 4</div><h3>What are you <em>aiming</em> for?</h3><p>Your target and deadline drive the study plan, the daily goal and every recommendation Bloom makes.</p></div>
    <div style="max-width:600px;margin:0 auto">
      <div style="text-align:center;margin-bottom:22px">
        <div style="font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-4);font-weight:800;margin-bottom:12px">Target ${ex.scale==='band'?'band':'score'}</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:18px">
          <div class="band" style="width:96px;height:96px;border-radius:26px"><b style="font-size:33px">${p.target.toFixed(1)}</b><span>Target</span></div>
          <div style="text-align:left">
            <div style="font-size:13px;color:var(--ink-3);margin-bottom:9px">${scoreInExam(p.target, p.exam)} · ${bandToCEFR(p.target)} level</div>
            <input class="range" type="range" min="4" max="9" step="0.5" value="${p.target}" style="width:260px" oninput="B.profile.target=+this.value;obPaint()">
            <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-4);width:260px;margin-top:4px"><span>4.0</span><span>6.5</span><span>9.0</span></div>
          </div>
        </div>
      </div>
      <div class="fg" style="margin-bottom:18px"><label>Why do you need this score?</label>
        <div class="pills">${PURPOSES.map(x=>`<button class="pill ${p.purpose===x.id?'on':''}" onclick="B.profile.purpose='${x.id}';obPaint()"><i class="fa-solid ${x.ic}"></i> ${x.name}</button>`).join('')}</div>
      </div>
      <div style="padding:12px 15px;border-radius:12px;background:var(--amber-soft);font-size:12.5px;color:#8a5a10;margin-bottom:18px"><i class="fa-solid fa-lightbulb"></i> ${PURPOSES.find(x=>x.id===p.purpose).note}</div>
      <div class="fg"><label>Test date <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-4)">(leave blank if undecided)</span></label><input id="obDate" type="date" value="${p.testDate||''}" onchange="B.profile.testDate=this.value;obPaint()"></div>
      ${p.testDate ? `<div style="margin-top:10px;font-size:12.5px;color:var(--leaf-700);font-weight:700"><i class="fa-solid fa-hourglass-half"></i> ${daysTo(p.testDate)} days until your test</div>` : ''}
    </div>
    <div class="stage-ft"><button class="btn btn-g" onclick="obBack()"><i class="fa-solid fa-arrow-left"></i> Back</button><button class="btn btn-p" onclick="obNext()">Set my study time <i class="fa-solid fa-arrow-right"></i></button></div>`;
  }

  return `
    <div class="stage-hd"><div class="eb">Step 4 of 4</div><h3>How much time can you <em>really</em> give?</h3><p>Be honest rather than ambitious. A plan you actually follow beats one you abandon in week two.</p></div>
    <div style="max-width:520px;margin:0 auto;text-align:center">
      <div style="display:flex;justify-content:center;gap:14px;margin-bottom:24px">
        ${[1,2,3,4].map(h=>`<div class="tile ${p.hoursPerDay===h?'on':''}" style="width:104px" onclick="B.profile.hoursPerDay=${h};obPaint()">
          <span class="tk"><i class="fa-solid fa-circle-check"></i></span>
          <div class="nm" style="font-family:var(--display);font-size:24px">${h}h</div><div class="mt">per day</div></div>`).join('')}
      </div>
      <div style="padding:18px 20px;border-radius:16px;background:var(--leaf-50);text-align:left">
        <div style="font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--leaf-700);font-weight:800;margin-bottom:10px">What happens next</div>
        <div style="display:grid;gap:11px">
          ${[['fa-clipboard-question','A six-part placement test','Grammar, vocabulary, reading, listening, writing and speaking — about 25 minutes.'],
             ['fa-id-card','Your Bloom English Profile','A CEFR level, a band estimate per skill, and your strongest and weakest areas.'],
             ['fa-calendar-days','A study plan built from that profile','Weighted towards whatever the test says you are weakest at.']].map(([i,t,s])=>`
            <div style="display:flex;gap:12px;align-items:flex-start"><div style="width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--leaf-600);font-size:12px"><i class="fa-solid ${i}"></i></div>
            <div><b style="font-size:13px;display:block">${t}</b><span style="font-size:12px;color:var(--ink-3)">${s}</span></div></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="stage-ft"><button class="btn btn-g" onclick="obBack()"><i class="fa-solid fa-arrow-left"></i> Back</button><button class="btn btn-p btn-lg" onclick="obFinish()"><i class="fa-solid fa-seedling"></i> Start my placement test</button></div>`;
}

function obPaint(){ const el = document.getElementById('obStage'); if (el) el.innerHTML = obStageHTML(); else navTo('onboarding'); }
function obCollect(){
  const g = id => document.getElementById(id);
  if (g('obName')) B.profile.name = g('obName').value.trim() || 'Student';
  if (g('obEmail')) B.profile.email = g('obEmail').value.trim();
  if (g('obCountry')) B.profile.country = g('obCountry').value;
  if (g('obL1')) B.profile.l1 = g('obL1').value;
  if (g('obDate')) B.profile.testDate = g('obDate').value;
  save();
}
function obNext(){ obCollect(); obStep = Math.min(4, obStep+1); navTo('onboarding'); }
function obBack(){ obCollect(); obStep = Math.max(1, obStep-1); navTo('onboarding'); }
function obFinish(){
  obCollect();
  B.onboarded = true; B.profile.joined = today(); save();
  navTo('placement');
}
function daysTo(d){ if (!d) return 0; return Math.max(0, Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00')) / 86400000)); }

function resetBloom(){
  if (!confirm('Reset everything and start again from onboarding? All progress on this device will be erased.')) return;
  try { localStorage.removeItem('bloom_state'); } catch(e){}
  loadState(); obStep = 1; navTo('onboarding');
}

/* ── boot ── */
try { const t = localStorage.getItem('bloom_theme'); if (t === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeIc').className='fa-solid fa-sun'; } } catch(e){}
loadState();
consumeAuth();
window.addEventListener('resize', () => { document.getElementById('burger').style.display = window.innerWidth <= 860 ? 'grid' : 'none'; });
document.getElementById('burger').style.display = window.innerWidth <= 860 ? 'grid' : 'none';
</script>
