# Deploy — every push to main (and manual "Run workflow") builds the api/web
# images on the GitHub runner, pushes them to GHCR, then SSHs into the server
# to pull and restart. The server never builds; it only runs images.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST      e.g. 82.112.226.111
#   DEPLOY_PORT      SSH port, e.g. 2016
#   DEPLOY_USER      SSH user (root on this box)
#   DEPLOY_SSH_KEY   private key matching the pubkey in the server's authorized_keys
#   DEPLOY_PATH      /project/bloom/platform
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: platform/api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:main
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image (production target)
        uses: docker/build-push-action@v6
        with:
          context: platform/web
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:main
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull images and restart stack over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # Keep server-side compose/env-adjacent files in sync with the repo.
            git -C /project/bloom pull --ff-only
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull api web
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
            # Migrations run after the new code is up, through DATABASE_URL_DIRECT
            # (never DDL through the PgBouncer transaction pool).
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml exec -T api alembic upgrade head
            docker image prune -f
