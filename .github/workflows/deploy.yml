# Deploy — every push to main (and manual "Run workflow") builds the api/web
# images on the GitHub runner, pushes them to GHCR, then SSHs into the server
# to pull and restart. The server never builds; it only runs images.
#
# The server needs nothing repo-related: this workflow copies the two compose
# files over SSH, so the target only needs docker + a `.env` beside them.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST            e.g. 72.61.90.150
#   DEPLOY_PORT            SSH port, e.g. 22
#   DEPLOY_USER            SSH user
#   DEPLOY_SSH_KEY         private key matching a pubkey in the server's authorized_keys
#   DEPLOY_SSH_PASSPHRASE  only if the private key is passphrase-protected (else leave unset)
#   DEPLOY_PATH            directory on the server holding docker-compose.yml + .env
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: platform/api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:main
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image (production target)
        uses: docker/build-push-action@v6
        with:
          context: platform/web
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:main
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Ship compose files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          source: "platform/docker-compose.yml,platform/docker-compose.deploy.yml"
          target: "${{ secrets.DEPLOY_PATH }}/"
          strip_components: 1

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull api web
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
            # Migrations run after the new code is up, through DATABASE_URL_DIRECT
            # (never DDL through the PgBouncer transaction pool).
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml exec -T api alembic upgrade head
            docker image prune -f
