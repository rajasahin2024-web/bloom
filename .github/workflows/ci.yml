# CI — runs on every PR and every push to main.
# Mirrors platform/scripts/{lint,typecheck,test}.sh plus docker image builds.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      # Tests expect Postgres on localhost:5433 (DIRECT) + localhost:6432
      # (the PgBouncer port — raw Postgres answers fine for tests) and Redis
      # on localhost:6380, matching platform/api/app/tests/conftest.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom_dev_password
          POSTGRES_DB: bloom
        ports:
          - 5433:5432
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml

      - name: Install dependencies
        working-directory: platform/api
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        working-directory: platform/api
        run: ruff check app

      - name: Typecheck (mypy)
        working-directory: platform/api
        run: mypy app

      - name: Migrate test database
        working-directory: platform/api
        env:
          DATABASE_URL_DIRECT: postgresql+psycopg://bloom:bloom_dev_password@localhost:5433/bloom
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://bloom:bloom_dev_password@localhost:5433/bloom', autocommit=True); c.execute('CREATE EXTENSION IF NOT EXISTS vector')"
          alembic upgrade head

      - name: Test (pytest)
        working-directory: platform/api
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform/web
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        working-directory: platform/web
        run: pnpm lint

      - name: Typecheck (tsc)
        working-directory: platform/web
        run: pnpm typecheck

      - name: Test (vitest)
        working-directory: platform/web
        run: pnpm test

      - name: Build (vite)
        working-directory: platform/web
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -t bloom-api-ci platform/api

      - name: Build web production image
        run: docker build -t bloom-web-ci --target production platform/web
