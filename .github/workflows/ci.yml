# CI — runs on every PR and every push to main.
# Mirrors platform/scripts/{lint,typecheck,test}.sh plus docker image builds.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      # Tests expect Postgres on localhost:5433 (DIRECT), a real PgBouncer on
      # localhost:6432 (test_setup.py probes its admin console) and Redis on
      # localhost:6380, matching platform/api/app/tests/conftest.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom_dev_password
          POSTGRES_DB: bloom
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pgbouncer:
        image: edoburu/pgbouncer:v1.24.1-p1
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_USER: bloom
          DB_PASSWORD: bloom_dev_password
          DB_NAME: bloom
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          LISTEN_PORT: 6432
          ADMIN_USERS: bloom
        ports:
          - 6432:6432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 6432 -U bloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/api/pyproject.toml

      - name: Install dependencies
        working-directory: platform/api
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        working-directory: platform/api
        run: ruff check app

      - name: Typecheck (mypy)
        working-directory: platform/api
        run: mypy app

      - name: Create test database
        # The GHA postgres service only ships the default ``bloom`` DB (from
        # POSTGRES_DB). Tests must target the dedicated ``bloom_test`` DB —
        # NEVER ``bloom`` (TEC-179: running the suite against ``bloom`` wiped
        # admin-saved R2 creds). docker/postgres/init.sql handles this locally
        # via docker-entrypoint-initdb.d, but service containers start before
        # checkout so we cannot mount the init script here — create the DB
        # explicitly instead. Idempotent: skip if it already exists.
        # NB: kept on one line because python -c treats leading YAML
        # indentation as Python indentation (IndentationError otherwise).
        working-directory: platform/api
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://bloom:bloom_dev_password@localhost:5433/bloom', autocommit=True); cur=c.execute(\"SELECT 1 FROM pg_database WHERE datname='bloom_test'\"); c.execute('CREATE DATABASE bloom_test OWNER bloom') if not cur.fetchone() else None"

      - name: Migrate test database
        working-directory: platform/api
        env:
          DATABASE_URL_DIRECT: postgresql+psycopg://bloom:bloom_dev_password@localhost:5433/bloom_test
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://bloom:bloom_dev_password@localhost:5433/bloom_test', autocommit=True); c.execute('CREATE EXTENSION IF NOT EXISTS vector')"
          alembic upgrade head

      - name: Test (pytest)
        working-directory: platform/api
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform/web
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        working-directory: platform/web
        run: pnpm lint

      - name: Typecheck (tsc)
        working-directory: platform/web
        run: pnpm typecheck

      - name: Test (vitest)
        working-directory: platform/web
        run: pnpm test

      - name: Build (vite)
        working-directory: platform/web
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -t bloom-api-ci platform/api

      - name: Build web production image
        run: docker build -t bloom-web-ci --target production platform/web
