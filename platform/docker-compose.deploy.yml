# Deploy overlay — swapped in by the GitHub Actions deploy job.
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull api web
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# Replaces the local `build:` definitions for api/web with the GHCR images
# built by .github/workflows/deploy.yml. Infra services (postgres, pgbouncer,
# redis) already run image-based and are inherited unchanged.
# `.env` stays on the server — secrets never enter the repo or the images.
name: bloom

networks:
  # The mail engine's compose project (Stalwart on this host, /opt/stalwart).
  # api/worker stay attached so an internal management path remains available,
  # but MAIL_API_URL below uses the verified public HTTPS JMAP endpoint — the
  # adapter rejects plaintext http to non-loopback hosts (Security gate C1).
  stalwart-mail:
    name: stalwart_default
    external: true

services:
  api:
    build: !reset null
    image: ghcr.io/rajasahin2024-web/bloom-api:main
    environment:
      # Deploy overlay is production-only — never inherit API_ENV=development
      # from the server `.env` (TEC-195).
      API_ENV: production
      # Verified live for Stalwart JMAP management calls (TEC-192). Kept as a
      # compose literal so a stale server `.env` cannot point prod at the
      # loopback-only http alias or leave the adapter unconfigured.
      MAIL_API_URL: https://mailengine.bloomieltsacademy.com
    networks:
      - bloom
      - stalwart-mail

  worker:
    build: !reset null
    # Same image as api, different entrypoint — no extra build artifact.
    image: ghcr.io/rajasahin2024-web/bloom-api:main
    environment:
      API_ENV: production
      MAIL_API_URL: https://mailengine.bloomieltsacademy.com
    networks:
      - bloom
      - stalwart-mail

  web:
    build: !reset null
    image: ghcr.io/rajasahin2024-web/bloom-web:main
