# Bloom web — production nginx config (Dockerfile `production` target).
# Serves the Vite build and reverse-proxies API + crawler-facing routes to the
# api service, so the browser only ever talks to port 5173.
#
# Upstreams go through variables + Docker's embedded DNS (127.0.0.11) so nginx
# starts even if `api` isn't resolvable yet and re-resolves on api restarts.
resolver 127.0.0.11 valid=10s;

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Served by the API for crawlers — same contract as the Vite dev proxy.
    location = /sitemap.xml {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /llms.txt {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback — React Router owns all non-file routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
